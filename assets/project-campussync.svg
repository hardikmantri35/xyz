<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="csBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="csAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#csBg)"/>
  <!-- Dashboard UI Frame -->
  <rect x="70" y="50" width="660" height="350" rx="16" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <!-- Top Bar -->
  <rect x="70" y="50" width="660" height="48" rx="16" fill="#0f172a"/>
  <circle cx="105" cy="74" r="6" fill="#ef4444"/>
  <circle cx="125" cy="74" r="6" fill="#f59e0b"/>
  <circle cx="145" cy="74" r="6" fill="#10b981"/>
  <text x="400" y="79" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">CampusSync // JECRC University Portal</text>
  <!-- Left Side cards -->
  <rect x="105" y="125" width="260" height="110" rx="12" fill="#0f172a" stroke="rgba(56,189,248,0.2)"/>
  <text x="130" y="160" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Current CGPA</text>
  <text x="130" y="200" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">9.4 / 10.0</text>
  
  <rect x="105" y="255" width="260" height="115" rx="12" fill="#0f172a" stroke="rgba(139,92,246,0.2)"/>
  <text x="130" y="290" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Notes &amp; PYQs Downloaded</text>
  <text x="130" y="330" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">142 Files</text>

  <!-- Right Side Syllabus Radar / Subject Matrix -->
  <rect x="390" y="125" width="310" height="245" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.06)"/>
  <text x="415" y="160" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="600">Semester 1 Subjects</text>
  <!-- Subject Progress bars -->
  <text x="415" y="200" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Programming in C</text>
  <rect x="415" y="210" width="260" height="8" rx="4" fill="#334155"/>
  <rect x="415" y="210" width="240" height="8" rx="4" fill="url(#csAccent)"/>

  <text x="415" y="250" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Engineering Mathematics I</text>
  <rect x="415" y="260" width="260" height="8" rx="4" fill="#334155"/>
  <rect x="415" y="260" width="215" height="8" rx="4" fill="url(#csAccent)"/>

  <text x="415" y="300" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Digital Electronics &amp; Logic</text>
  <rect x="415" y="310" width="260" height="8" rx="4" fill="#334155"/>
  <rect x="415" y="310" width="195" height="8" rx="4" fill="url(#csAccent)"/>
</svg>
